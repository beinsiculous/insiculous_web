# The one path to production — and to staging. Every push to main or dev is validated, tested,
# type-checked and built before anything is uploaded, so a broken build can never reach
# beinsiculous.com — the deploy step only runs if the data gates, `check` and `build` (which
# includes scripts/postbuild-check.mjs) all pass. `npm run verify` runs the same steps locally,
# so the two cannot drift.
#
# Branch → destination:
#   main → the production Worker (insiculous-web, beinsiculous.com)
#   dev  → the staging Worker (insiculous-web-dev, its workers.dev URL) via `--env dev`
# Same gates for both; staging earns no shortcuts.
#
# Secrets this needs (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — an "Edit Cloudflare Workers" token, scoped to the account and to
#                            the beinsiculous.com zone (it owns the custom-domain route).
#   CLOUDFLARE_ACCOUNT_ID  — the account the insiculous-web Worker lives in.
#
# The Cloudflare dashboard's own Workers Builds Git integration must stay disconnected, or the
# same commit would deploy twice from two places.
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch: # deploy the current branch by hand from the Actions tab

# One deploy at a time per destination; never cancel one mid-upload.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    # 30, not 15: the accessibility step's `playwright install --with-deps` apt-installs fonts, and a
    # slow Ubuntu mirror can stretch that from ~1 min to ~15 (2026-08-19: 9m25s for a single 5.6 MB
    # font package, which killed a deploy at the old limit while wrangler was still queued behind it).
    # The durable fix is to stop apt-installing on every run — a Playwright container image, or
    # dropping --with-deps — but that changes what the gate runs on, so it is its own change.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The data tooling is stdlib-only, so there is nothing to install for it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      # The data gates come first: they are the cheapest, and a rule broken in scripts/fk_core/ or
      # data/ is what the site would otherwise render happily. The test suite drives the canonical
      # modules in src/lib/shared/ through node to check they still match their Python twins, so it
      # needs the node that setup-node just provided.
      - name: Validate data
        run: python3 scripts/validate.py

      - name: Data tests
        run: python3 -m unittest discover tests

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # Same gate as local `npm run verify`: axe-core over every built page. A new WCAG
      # regression blocks the deploy exactly like a broken build does.
      - name: Accessibility audit
        run: |
          npx playwright install --with-deps chromium
          npm run a11y

      # Same gate as local `npm run verify`: every page served from dist/ (the script serves it
      # itself) answers 200 and scrolls nowhere sideways — desktop, phone, 641px, and 125% text
      # on a phone (LARGE_TEXT=1). Reuses the chromium the previous step installed.
      - name: Layout gate (screenshots + overflow)
        run: LARGE_TEXT=1 npm run shots

      - name: Deploy to Cloudflare
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            npx wrangler deploy --env dev | tee deploy.log
          else
            npx wrangler deploy | tee deploy.log
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deploy that reports success but does not serve is the failure mode this whole file
      # exists to catch, so ask the live site before calling it done. Production has a fixed
      # domain; staging's workers.dev URL comes from wrangler's own deploy output.
      - name: Check the site is serving
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
            if [ -z "$url" ]; then echo "no workers.dev URL in deploy output"; exit 1; fi
          else
            url="https://beinsiculous.com/"
          fi
          echo "checking $url"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "$url did not return 200 after the deploy"
          exit 1
